[project]
name = "llm-wiki"
version = "0.1.0"
description = "Agent-native retrieval: compile documents into a navigable Wiki and answer questions by traversing it (implementation of arXiv 2605.25480)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
eval = ["datasets>=2.19"]

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_wiki"]

[tool.pytest.ini_options]
markers = ["api: tests that call the real Anthropic API"]
addopts = "-m 'not api'"
